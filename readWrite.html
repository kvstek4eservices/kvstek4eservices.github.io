<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
    background: #f4f7fb;
    padding: 30px;
    color: #1f2937;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    color: #2563eb;
    margin-bottom: 8px;
}

.header p {
    color: #6b7280;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.card h2 {
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

label {
    font-weight: 600;
    margin-bottom: 7px;
}

input,
textarea {
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #2563eb;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #93c5fd;
    cursor: not-allowed;
}

.refresh-btn {
    background: #059669;
}

.refresh-btn:hover {
    background: #047857;
}

.button-area {
    margin-top: 25px;
}

.message {
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    display: none;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #15803d;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #dc2626;
}

.message.loading {
    display: block;
    background: #dbeafe;
    color: #2563eb;
}

.records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1050px;
}

th {
    background: #2563eb;
    color: white;
    padding: 14px;
    text-align: left;
    white-space: nowrap;
}

td {
    padding: 13px;
    border-bottom: 1px solid #e5e7eb;
    vertical-align: top;
}

tr:hover {
    background: #f9fafb;
}

.remarks {
    max-width: 250px;
    word-wrap: break-word;
}

#recordStatus {
    margin-top: 15px;
    font-weight: 600;
}

.record-success {
    color: #15803d;
}

.record-error {
    color: #dc2626;
}

.record-loading {
    color: #2563eb;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media (max-width: 700px) {

    body {
        padding: 15px;
    }

    .card {
        padding: 20px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .records-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

```
<h1>Student Registration</h1>

<p>
    Fill in your details and submit the registration.
</p>
```

</div>

<!-- REGISTRATION FORM -->

<div class="card">

```
<h2>Registration Form</h2>

<form id="registrationForm">


    <div class="form-grid">


        <div class="form-group">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required>

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>

        </div>


        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter phone number"
                required>

        </div>


        <div class="form-group">

            <label>Qualification</label>

            <input
                type="text"
                name="qualification"
                placeholder="Enter qualification"
                required>

        </div>


        <div class="form-group full">

            <label>Remarks</label>

            <textarea
                name="remarks"
                placeholder="Enter any remarks"></textarea>

        </div>


    </div>


    <div class="button-area">

        <button
            type="submit"
            id="submitButton">

            Register

        </button>

    </div>


    <div
        id="formMessage"
        class="message">

    </div>


</form>
```

</div>

<!-- REGISTRATION RECORDS -->

<div class="card">

```
<div class="records-header">

    <h2>Registration Records</h2>

    <button
        class="refresh-btn"
        onclick="loadData()">

        🔄 Refresh Data

    </button>

</div>


<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>Application Date</th>

                <th>Name</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Qualification</th>

                <th>Remarks</th>

            </tr>

        </thead>


        <tbody id="tableBody">

        </tbody>

    </table>

</div>


<div id="recordStatus"></div>
```

</div>

</div>

<script>


// ======================================================
// YOUR TWO DIFFERENT APPS SCRIPT URLs
// ======================================================


// INSERT SCRIPT
// This script contains doPost()

const INSERT_URL =
"https://script.google.com/macros/s/AKfycbzWyAbk36aqJnrzqAhIu_do5ELZ7Tpw64c1Jz7dZ2xJjUxR9B7bcZ1CG7Y1CodAoWuP/exec";


// READ SCRIPT
// This script contains doGet()

const READ_URL =
"https://script.google.com/macros/s/AKfycbzW3SSlUxKFKrRA68M7Hjar57qjSr4gQ1ADawvHWX2W5_4IFsPqQOzImyJADbsJOHy0/exec";



// ======================================================
// INSERT REGISTRATION
// ======================================================

document
.getElementById("registrationForm")
.addEventListener("submit", function(event) {


    event.preventDefault();


    const form = this;

    const button =
        document.getElementById("submitButton");

    const message =
        document.getElementById("formMessage");


    button.disabled = true;

    button.innerHTML = "Submitting...";


    message.className =
        "message loading";

    message.innerHTML =
        "Submitting registration...";


    const formData =
        new FormData(form);


    const params =
        new URLSearchParams();


    formData.forEach((value, key) => {

        params.append(key, value);

    });


    fetch(INSERT_URL, {

        method: "POST",

        body: params

    })


    .then(response => {

        return response.text();

    })


    .then(text => {


        console.log(
            "Insert response:",
            text
        );


        let result;


        try {

            result = JSON.parse(text);

        }

        catch(error) {

            throw new Error(
                "Invalid response from insert script"
            );

        }


        if (!result.success) {

            throw new Error(
                result.error ||
                "Registration failed"
            );

        }


        message.className =
            "message success";


        message.innerHTML =
            "✓ Registration submitted successfully.";


        form.reset();


        // Refresh records after insertion

        loadData();


    })


    .catch(error => {


        console.error(
            "Insert error:",
            error
        );


        message.className =
            "message error";


        message.innerHTML =
            "✕ " + error.message;


    })


    .finally(() => {

        button.disabled = false;

        button.innerHTML = "Register";

    });

});



// ======================================================
// READ REGISTRATION RECORDS
// ======================================================

function loadData() {


    const tbody =
        document.getElementById("tableBody");


    const status =
        document.getElementById("recordStatus");


    tbody.innerHTML = "";


    status.className =
        "record-loading";


    status.innerHTML =
        "Loading registration records...";


    fetch(READ_URL)


    .then(response => {


        if (!response.ok) {

            throw new Error(
                "HTTP Error: " +
                response.status
            );

        }


        return response.json();

    })


    .then(data => {


        console.log(
            "Read response:",
            data
        );


        if (!Array.isArray(data)) {

            throw new Error(
                data.error ||
                "Invalid response from read script"
            );

        }


        if (data.length === 0) {


            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty">

                        No registration records found.

                    </td>

                </tr>

            `;


            status.className = "";

            status.innerHTML =
                "No records found.";


            return;

        }


        data.forEach(row => {


            const tr =
                document.createElement("tr");


            const timestamp =
                document.createElement("td");

            timestamp.textContent =
                row.timestamp || "";


            const name =
                document.createElement("td");

            name.textContent =
                row.name || "";


            const email =
                document.createElement("td");

            email.textContent =
                row.email || "";


            const phone =
                document.createElement("td");

            phone.textContent =
                row.phone || "";


            const qualification =
                document.createElement("td");

            qualification.textContent =
                row.qualification || "";


            const remarks =
                document.createElement("td");

            remarks.className =
                "remarks";

            remarks.textContent =
                row.remarks || "";


            tr.appendChild(timestamp);

            tr.appendChild(name);

            tr.appendChild(email);

            tr.appendChild(phone);

            tr.appendChild(qualification);

            tr.appendChild(remarks);


            tbody.appendChild(tr);

        });


        status.className =
            "record-success";


        status.innerHTML =
            "Loaded " +
            data.length +
            " registration record(s) successfully.";


    })


    .catch(error => {


        console.error(
            "Read error:",
            error
        );


        status.className =
            "record-error";


        status.innerHTML =
            "Failed to load records: " +
            error.message;


    });

}



// ======================================================
// LOAD RECORDS WHEN PAGE OPENS
// ======================================================

window.addEventListener(
    "load",
    loadData
);


</script>

</body>

</html>
